apiVersion: apps/v1
kind: Deployment
metadata:
  name: nossalista-dev
  namespace: nossalista-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nossalista-dev
  template:
    metadata:
      labels:
        app: nossalista-dev
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: nossalista-dev
          image: ghcr.io/leoferolive/nossalista-dev:bootstrap
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nossalista-secrets
          env:
            # Ativa o profile Spring `dev` (CORS/origens dev etc. em application-dev.yml).
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            # Metadata de build (APP_VERSION / APP_GIT_TAG / APP_GIT_SHA /
            # APP_BUILD_TIME / APP_ENVIRONMENT) NÃO é declarada aqui: já vem
            # embutida como ENV na imagem (Dockerfile), que é a fonte única.
            # Placeholders estáticos (bootstrap/unknown) só mascarariam o valor
            # real do container.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            # initialDelaySeconds baixo: o startupProbe começa a sondar cedo e o
            # failureThreshold cobre o tempo de boot. Janela total de boot =
            # initialDelaySeconds + periodSeconds*failureThreshold = 15 + 10*30 = 315s.
            # O boot real no Raspberry Pi ARM mede ~180-195s ("Started ... in 182s");
            # com 195s o startupProbe matava o container por uma margem de ~0,2s e
            # provocava crash-loop. 315s dá folga confortável sobre o pior caso medido.
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
