apiVersion: apps/v1
kind: Deployment
metadata:
  name: nossalista-dev
  namespace: nossalista-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nossalista-dev
  template:
    metadata:
      labels:
        app: nossalista-dev
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: nossalista-dev
          image: ghcr.io/leoferolive/nossalista-dev:bootstrap
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nossalista-secrets
          env:
            - name: APP_ENVIRONMENT
              value: dev
            - name: APP_VERSION
              value: bootstrap
            - name: APP_GIT_TAG
              value: bootstrap
            - name: APP_GIT_SHA
              value: unknown
            - name: APP_BUILD_TIME
              value: unknown
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
