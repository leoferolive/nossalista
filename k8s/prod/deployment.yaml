apiVersion: apps/v1
kind: Deployment
metadata:
  name: nossalista
  namespace: nossalista
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nossalista
  template:
    metadata:
      labels:
        app: nossalista
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: nossalista
          image: ghcr.io/leoferolive/nossalista:bootstrap
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nossalista-secrets
          env:
            # Ativa o profile Spring `prod` (application-prod.yml).
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # Metadata de build (APP_VERSION / APP_GIT_TAG / APP_GIT_SHA /
            # APP_BUILD_TIME / APP_ENVIRONMENT) NÃO é declarada aqui: já vem
            # embutida como ENV na imagem (Dockerfile), que é a fonte única.
            # Placeholders estáticos (bootstrap/unknown) só mascarariam o valor
            # real do container.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
