<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prévia — NossaLista no leoferolive design</title>
<style>
/* ===== Fontes self-hosted ===== */
@font-face { font-family:'Fraunces'; src:url('fonts/Fraunces.ttf') format('truetype-variations'); font-weight:100 900; font-stretch:75% 125%; font-display:swap; }
@font-face { font-family:'Plus Jakarta Sans'; src:url('fonts/PlusJakartaSans.ttf') format('truetype-variations'); font-weight:200 800; font-display:swap; }

/* ===== Tokens leoferolive (mesmos valores do kit) ===== */
:root, :root[data-theme='light'] {
  --nl-bg:#f7f6fb; --nl-bg-soft:#efedf5; --nl-surface-strong:#fff; --nl-surface:#fff; --nl-surface-muted:#f1eff7;
  --nl-card-shadow:0 1px 2px rgba(16,24,40,.04),0 10px 24px rgba(16,24,40,.06);
  --nl-border:rgba(40,25,70,.10); --nl-border-strong:rgba(40,25,70,.18);
  --nl-text:#1e1a2b; --nl-text-muted:#564f68;
  --nl-accent:#7c3aed; --nl-accent-strong:#6326c9; --nl-accent-soft:rgba(124,58,237,.12);
  --nl-primary:#14b8a6; --nl-primary-strong:#0d9488; --nl-danger:#e5484d; --nl-focus:rgba(124,58,237,.30); --nl-btn-text:#fff;
}
:root[data-theme='dark'], [data-theme='dark'] {
  --nl-bg:#14101e; --nl-bg-soft:#181426; --nl-surface-strong:#211b35; --nl-surface:#1d1830; --nl-surface-muted:#271f3d;
  --nl-card-shadow:0 28px 54px rgba(0,0,0,.32);
  --nl-border:rgba(255,255,255,.09); --nl-border-strong:rgba(255,255,255,.17);
  --nl-text:#ece9f4; --nl-text-muted:#a39db5;
  --nl-accent:#a78bfa; --nl-accent-strong:#8b5cf6; --nl-accent-soft:rgba(167,139,250,.16);
  --nl-primary:#2dd4bf; --nl-primary-strong:#14b8a6; --nl-danger:#ff6b6f; --nl-focus:rgba(167,139,250,.34); --nl-btn-text:#160f29;
}

/* ===== Subconjunto das classes .nl-* REAIS do NossaLista (inalteradas) ===== */
body { margin:0; font-family:'Plus Jakarta Sans',sans-serif; color:var(--nl-text); background:linear-gradient(180deg,var(--nl-bg),var(--nl-bg-soft)); }
h1,h2,h3 { font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0; }
.nl-card { position:relative; background:linear-gradient(180deg,var(--nl-surface-strong),var(--nl-surface)); border:1px solid var(--nl-border); border-radius:1.75rem; box-shadow:var(--nl-card-shadow); overflow:hidden; }
.nl-card::before { content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; background:linear-gradient(140deg,color-mix(in srgb,var(--nl-accent) 25%,transparent),transparent 58%,color-mix(in srgb,var(--nl-primary) 18%,transparent)); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
.nl-btn-primary,.nl-btn-secondary { display:inline-flex; min-height:3rem; align-items:center; justify-content:center; gap:.65rem; border-radius:1rem; padding:.9rem 1.25rem; font-size:.875rem; font-weight:800; cursor:pointer; transition:transform 180ms ease; }
.nl-btn-primary { color:var(--nl-btn-text); border:1px solid color-mix(in srgb,var(--nl-accent-strong) 45%,transparent); background:linear-gradient(135deg,color-mix(in srgb,var(--nl-accent) 88%,white),var(--nl-accent-strong)); box-shadow:0 16px 28px color-mix(in srgb,var(--nl-accent) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.2); }
.nl-btn-secondary { color:var(--nl-text); border:1px solid var(--nl-border); background:color-mix(in srgb,var(--nl-surface-strong) 96%,transparent); }
.nl-btn-primary:hover,.nl-btn-secondary:hover { transform:translateY(-1px); }
.nl-badge { display:inline-flex; align-items:center; gap:.5rem; border-radius:999px; border:1px solid color-mix(in srgb,var(--nl-primary) 24%,var(--nl-border)); background:color-mix(in srgb,var(--nl-primary) 10%,transparent); padding:.5rem .85rem; font-size:.68rem; font-weight:800; letter-spacing:.22em; text-transform:uppercase; color:var(--nl-primary); }
.nl-badge::before { content:''; width:.5rem; height:.5rem; border-radius:999px; background:currentColor; box-shadow:0 0 12px currentColor; }
.nl-gradient-text { background:linear-gradient(140deg,var(--nl-accent) 8%,color-mix(in srgb,var(--nl-accent) 62%,var(--nl-primary)) 92%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.nl-input { width:100%; border-radius:1rem; border:1px solid var(--nl-border); background:var(--nl-surface-strong); padding:.95rem 1rem; color:var(--nl-text); box-sizing:border-box; }
.nl-input::placeholder { color:color-mix(in srgb,var(--nl-text-muted) 72%,transparent); }
.nl-label { display:block; margin-bottom:.45rem; font-size:.82rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--nl-text-muted); }
.nl-check { display:inline-flex; width:1.4rem; height:1.4rem; flex:0 0 1.4rem; align-items:center; justify-content:center; border-radius:.45rem; border:1px solid var(--nl-border-strong); color:var(--nl-primary); }
.nl-check[data-done='true'] { background:linear-gradient(135deg,color-mix(in srgb,var(--nl-primary) 92%,white),var(--nl-primary-strong)); border-color:transparent; color:#fff; box-shadow:0 12px 24px color-mix(in srgb,var(--nl-primary) 22%,transparent); }
.nl-pill { display:inline-flex; align-items:center; gap:.45rem; border-radius:999px; border:1px solid var(--nl-border); background:color-mix(in srgb,var(--nl-surface-strong) 94%,transparent); padding:.45rem .8rem; font-size:.78rem; font-weight:700; color:var(--nl-text-muted); }

/* layout da prévia */
.stage { display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:32px; align-items:start; }
.panel { padding:26px; border-radius:24px; }
.panel.l { background:linear-gradient(180deg,#f7f6fb,#efedf5); }
.panel.d { background:linear-gradient(180deg,#14101e,#181426); }
.tag { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#968fa8; margin-bottom:16px; }
.demo { display:flex; flex-direction:column; gap:16px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.item { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--nl-border); }
.item .t { flex:1; font-weight:600; font-size:15px; }
.item .t.done { text-decoration:line-through; color:var(--nl-text-muted); }
.bar { height:10px; border-radius:999px; background:var(--nl-surface-muted); overflow:hidden; border:1px solid var(--nl-border); }
.bar>i { display:block; height:100%; width:62%; border-radius:999px; background:linear-gradient(90deg,var(--nl-accent),var(--nl-primary)); }
@media (max-width:760px){ .stage{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="stage">
  <div class="panel l">
    <div class="tag">Tema claro</div>
    <div class="nl-card" style="padding:22px;">
      <div class="row" style="margin-bottom:12px;"><span class="nl-badge">Compartilhada</span><span class="nl-pill">3 membros</span></div>
      <h1 style="font-size:30px;letter-spacing:-.02em;line-height:1.1;">Compras da <span class="nl-gradient-text">semana</span></h1>
      <div style="margin:16px 0 6px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;"><span style="color:var(--nl-text-muted);">2 de 5 concluídos</span><span class="nl-gradient-text">62%</span></div>
      <div class="bar"><i></i></div>
      <div class="item"><span class="nl-check" data-done="true">✓</span><span class="t done">Bananas</span></div>
      <div class="item"><span class="nl-check"></span><span class="t">Café em grãos</span></div>
      <div class="row" style="margin-top:18px;"><span class="nl-btn-primary">Adicionar item</span><span class="nl-btn-secondary">Convidar</span></div>
    </div>
    <div style="margin-top:18px;">
      <label class="nl-label">Novo item</label>
      <input class="nl-input" placeholder="Ex: Leite integral" />
    </div>
  </div>

  <div class="panel d" data-theme="dark">
    <div class="tag">Tema escuro</div>
    <div class="nl-card" style="padding:22px;">
      <div class="row" style="margin-bottom:12px;"><span class="nl-badge">Compartilhada</span><span class="nl-pill">3 membros</span></div>
      <h1 style="font-size:30px;letter-spacing:-.02em;line-height:1.1;color:var(--nl-text);">Compras da <span class="nl-gradient-text">semana</span></h1>
      <div style="margin:16px 0 6px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;"><span style="color:var(--nl-text-muted);">2 de 5 concluídos</span><span class="nl-gradient-text">62%</span></div>
      <div class="bar"><i></i></div>
      <div class="item"><span class="nl-check" data-done="true">✓</span><span class="t done">Bananas</span></div>
      <div class="item"><span class="nl-check"></span><span class="t" style="color:var(--nl-text);">Café em grãos</span></div>
      <div class="row" style="margin-top:18px;"><span class="nl-btn-primary">Adicionar item</span><span class="nl-btn-secondary">Convidar</span></div>
    </div>
    <div style="margin-top:18px;">
      <label class="nl-label">Novo item</label>
      <input class="nl-input" placeholder="Ex: Leite integral" />
    </div>
  </div>
</div>
</body>
</html>
