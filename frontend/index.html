<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('nl-theme')
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (s === 'dark' || (!s && d)) {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NossaLista" />
    <meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14101e" media="(prefers-color-scheme: dark)" />
    <title>NossaLista - Listas Compartilhadas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
