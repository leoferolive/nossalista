name: Deploy Dev (nossalista.home)

on:
  workflow_run:
    workflows: [CI]
    branches: ["release/**"]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite o nome da branch para confirmar o deploy"
        required: true

concurrency:
  group: deploy-dev-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    uses: leoferolive/self-workflows/.github/workflows/deploy.yml@main
    with:
      app_name: nossalista-dev
      app_namespace: nossalista-dev
      app_type: backend
      dockerfile_path: ./Dockerfile
      k8s_path: ./k8s/dev
      image_tag: dev
    secrets: inherit
