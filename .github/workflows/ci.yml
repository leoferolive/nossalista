name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'contracts/**'
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - 'contracts/**'

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend stylelint
        working-directory: frontend
        run: npm run stylelint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend bundle size check
        working-directory: frontend
        run: npm run bundle:check

      - name: Frontend runtime smoke
        working-directory: frontend
        run: |
          npm run preview:smoke > /tmp/frontend-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 > /dev/null
          kill "$PREVIEW_PID"

      - name: Frontend coverage no-decrease
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add /tmp/nossalista-base "origin/${{ github.base_ref }}"
          cd /tmp/nossalista-base/frontend
          npm ci
          npm run test:coverage
          python3 /home/runner/work/nossalista/nossalista/scripts/coverage/compare_frontend_coverage.py \
            /home/runner/work/nossalista/nossalista/frontend/coverage/coverage-summary.json \
            /tmp/nossalista-base/frontend/coverage/coverage-summary.json

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend e2e PR suite
        working-directory: frontend
        run: npm run test:e2e:pr

      - name: Upload frontend e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results

  backend-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Backend quality gate
        working-directory: backend
        run: ./mvnw -B -Pstrict-quality verify -Ddependency-check.skip=true

      - name: Backend regression tests
        working-directory: backend
        run: ./mvnw -B -Pregression-tests test

      - name: Backend coverage no-decrease
        if: github.event_name == 'pull_request'
        run: |
          pip install defusedxml
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add /tmp/nossalista-base "origin/${{ github.base_ref }}"
          cd /tmp/nossalista-base/backend
          chmod +x mvnw
          ./mvnw -B test jacoco:report
          python3 /home/runner/work/nossalista/nossalista/scripts/coverage/compare_backend_coverage.py \
            /home/runner/work/nossalista/nossalista/backend/target/site/jacoco/jacoco.xml \
            /tmp/nossalista-base/backend/target/site/jacoco/jacoco.xml

      - name: Upload backend JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            backend/target/site/jacoco
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json

  backend-smoke:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Package backend for smoke run
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Backend runtime smoke
        working-directory: backend
        run: |
          java -jar target/*.jar --spring.profiles.active=ci > /tmp/backend-smoke.log 2>&1 &
          APP_PID=$!
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null
          kill "$APP_PID"

  security-and-compliance:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@v2

      - name: Gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d v)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact

      - name: Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/security-audit --error .

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Frontend license policy
        working-directory: frontend
        run: npx --yes license-checker --production --failOn 'GPL;AGPL;LGPL'

      - name: Cache NVD database
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Backend dependency check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          ./mvnw -B org.owasp:dependency-check-maven:check
