name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.21.2'

jobs:
  changes:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'contracts/**'
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - 'contracts/**'

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend stylelint
        working-directory: frontend
        run: npm run stylelint

      # typecheck removed — tsc already runs as part of `npm run build` (same tsconfig.json)

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend bundle size check
        working-directory: frontend
        run: npm run bundle:check

      - name: Frontend runtime smoke
        working-directory: frontend
        run: |
          npm run preview:smoke > /tmp/frontend-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 > /dev/null
          kill "$PREVIEW_PID"

      - name: Prepare base frontend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/base-frontend-coverage
          cp frontend/coverage/coverage-summary.json /tmp/base-frontend-coverage/

      - name: Save base frontend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: /tmp/base-frontend-coverage
          key: base-frontend-coverage-${{ github.sha }}

      - name: Restore base frontend coverage
        if: github.event_name == 'pull_request'
        id: base-frontend-coverage
        uses: actions/cache/restore@v4
        with:
          path: /tmp/base-frontend-coverage
          key: base-frontend-coverage-${{ github.event.pull_request.base.sha }}

      - name: Frontend coverage no-decrease
        if: github.event_name == 'pull_request' && steps.base-frontend-coverage.outputs.cache-hit == 'true'
        run: |
          python3 scripts/coverage/compare_frontend_coverage.py \
            frontend/coverage/coverage-summary.json \
            /tmp/base-frontend-coverage/coverage-summary.json

      - name: Skip frontend coverage check (no baseline)
        if: github.event_name == 'pull_request' && steps.base-frontend-coverage.outputs.cache-hit != 'true'
        run: echo "::warning::No base frontend coverage cached for ${{ github.event.pull_request.base.sha }}. Skipping comparison."

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          if [ ! -d ~/.cache/ms-playwright ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium 2>/dev/null || true
          fi

      - name: Frontend e2e PR suite
        working-directory: frontend
        run: npm run test:e2e:pr

      - name: Upload frontend e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results

  backend-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, linux, ARM64]
    env:
      MAVEN_OPTS: "-Xmx1g -XX:+UseG1GC"
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Install n1-detector from source
        working-directory: backend
        run: |
          rm -rf /tmp/n1-detector
          git clone --depth 1 https://github.com/leoferolive/n1-detector.git /tmp/n1-detector
          sed -i 's|<maven.compiler.release>21</maven.compiler.release>|<maven.compiler.release>25</maven.compiler.release>|' /tmp/n1-detector/clients/java/pom.xml
          ./mvnw -B -f /tmp/n1-detector/clients/java/pom.xml install -DskipTests

      - name: Verify n1-detector installation
        run: |
          ls -la ~/.m2/repository/io/n1detector/n1-detector-core/0.1.0/
          ls -la ~/.m2/repository/io/n1detector/n1-detector-hibernate/0.1.0/
          ls -la ~/.m2/repository/io/n1detector/n1-detector-junit/0.1.0/
          ls -la ~/.m2/repository/io/n1detector/n1-detector-cli/0.1.0/

      - name: Backend quality gate
        working-directory: backend
        run: ./mvnw -B -Pstrict-quality verify -Ddependency-check.skip=true

      # regression-tests step removed — verify without testGroups already runs all tests (no filter)

      - name: Check N+1 query report
        if: always()
        working-directory: backend
        run: |
          if [ -f target/n1-report.json ]; then
            java -jar ~/.m2/repository/io/n1detector/n1-detector-cli/0.1.0/n1-detector-cli-0.1.0-jar-with-dependencies.jar check-report target/n1-report.json
          fi

      - name: Prepare base backend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/base-backend-coverage
          cp backend/target/site/jacoco/jacoco.xml /tmp/base-backend-coverage/

      - name: Save base backend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: /tmp/base-backend-coverage
          key: base-backend-coverage-${{ github.sha }}

      - name: Restore base backend coverage
        if: github.event_name == 'pull_request'
        id: base-backend-coverage
        uses: actions/cache/restore@v4
        with:
          path: /tmp/base-backend-coverage
          key: base-backend-coverage-${{ github.event.pull_request.base.sha }}

      - name: Backend coverage no-decrease
        if: github.event_name == 'pull_request' && steps.base-backend-coverage.outputs.cache-hit == 'true'
        run: |
          pip install defusedxml
          python3 scripts/coverage/compare_backend_coverage.py \
            backend/target/site/jacoco/jacoco.xml \
            /tmp/base-backend-coverage/jacoco.xml

      - name: Skip backend coverage check (no baseline)
        if: github.event_name == 'pull_request' && steps.base-backend-coverage.outputs.cache-hit != 'true'
        run: echo "::warning::No base backend coverage cached for ${{ github.event.pull_request.base.sha }}. Skipping comparison."

      - name: Upload backend JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            backend/target/site/jacoco
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
            backend/target/n1-report.json

      - name: Backend runtime smoke
        working-directory: backend
        run: |
          java -jar target/*.jar --spring.profiles.active=ci > /tmp/backend-smoke.log 2>&1 &
          APP_PID=$!
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
            echo "::error::Backend failed to start within 120s"
            echo "--- Smoke log: key events ---"
            grep -E "Started|ERROR|WARN|Exception|FAILED|Tomcat|template" /tmp/backend-smoke.log | tail -30 || true
            echo "--- Smoke log: last 30 lines ---"
            tail -30 /tmp/backend-smoke.log
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$APP_PID"

  # backend-smoke job removed — smoke test is now the last step in backend-quality

  security-and-compliance:
    needs: changes
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-node

      - name: Setup Java
        if: needs.changes.outputs.backend == 'true'
        uses: ./.github/actions/setup-java

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@v2

      - name: Cache Gitleaks
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: ~/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bin
          ARCH=$(dpkg --print-architecture)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" | tar -xz gitleaks
          mv gitleaks ~/bin/gitleaks

      - name: Gitleaks
        run: ~/bin/gitleaks detect --source . --redact

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-${{ runner.arch }}

      - name: Semgrep
        run: |
          if [ ! -f ~/semgrep-venv/bin/semgrep ]; then
            python3 -m venv ~/semgrep-venv
            ~/semgrep-venv/bin/pip install semgrep --quiet
          fi
          ~/semgrep-venv/bin/semgrep scan --config p/security-audit --error .

      - name: Frontend install
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Frontend license policy
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npx --yes license-checker --production --failOn 'GPL;AGPL;LGPL'

      - name: Set NVD cache week
        if: needs.changes.outputs.backend == 'true'
        run: echo "NVD_WEEK=$(date +'%Y-%U')" >> "$GITHUB_ENV"

      - name: Cache NVD database
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-week-${{ env.NVD_WEEK }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Install n1-detector from source
        if: needs.changes.outputs.backend == 'true'
        run: |
          if [ ! -f ~/.m2/repository/io/n1detector/n1-detector-junit/0.1.0/n1-detector-junit-0.1.0.jar ]; then
            rm -rf /tmp/n1-detector-sec
            git clone --depth 1 https://github.com/leoferolive/n1-detector.git /tmp/n1-detector-sec
            sed -i 's|<maven.compiler.release>21</maven.compiler.release>|<maven.compiler.release>25</maven.compiler.release>|' /tmp/n1-detector-sec/clients/java/pom.xml
            (cd backend && ./mvnw -B -f /tmp/n1-detector-sec/clients/java/pom.xml install -DskipTests)
          fi

      - name: Backend dependency check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          ./mvnw -B org.owasp:dependency-check-maven:check
