name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read
  pull-requests: write   # decoração de PR (reviewdog, comentário de cobertura)
  checks: write          # dorny/test-reporter cria Check Run

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.21.2'
  EC_VERSION: '3.7.0'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'contracts/**'
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - 'contracts/**'

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend stylelint
        working-directory: frontend
        run: npm run stylelint

      # typecheck removed — tsc already runs as part of `npm run build` (same tsconfig.json)

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend bundle size check
        working-directory: frontend
        run: npm run bundle:check

      - name: Frontend runtime smoke
        working-directory: frontend
        run: |
          npm run preview:smoke > /tmp/frontend-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 > /dev/null
          kill "$PREVIEW_PID"

      - name: Prepare base frontend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/base-frontend-coverage
          cp frontend/coverage/coverage-summary.json /tmp/base-frontend-coverage/

      - name: Save base frontend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: /tmp/base-frontend-coverage
          key: base-frontend-coverage-${{ github.sha }}

      - name: Restore base frontend coverage
        if: github.event_name == 'pull_request'
        id: base-frontend-coverage
        uses: actions/cache/restore@v4
        with:
          path: /tmp/base-frontend-coverage
          key: base-frontend-coverage-${{ github.event.pull_request.base.sha }}

      - name: Frontend coverage no-decrease
        if: github.event_name == 'pull_request' && steps.base-frontend-coverage.outputs.cache-hit == 'true'
        run: |
          python3 scripts/coverage/compare_frontend_coverage.py \
            frontend/coverage/coverage-summary.json \
            /tmp/base-frontend-coverage/coverage-summary.json

      - name: Skip frontend coverage check (no baseline)
        if: github.event_name == 'pull_request' && steps.base-frontend-coverage.outputs.cache-hit != 'true'
        run: echo "::warning::No base frontend coverage cached for ${{ github.event.pull_request.base.sha }}. Skipping comparison."

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          if [ ! -d ~/.cache/ms-playwright ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium 2>/dev/null || true
          fi

      - name: Frontend e2e PR suite
        working-directory: frontend
        run: npm run test:e2e:pr

      - name: Upload frontend e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results

  backend-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: "-Xmx1g -XX:+UseG1GC"
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo p/ diff-cover e PIT (git diff vs base)

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Install Python deps for quality scripts
        # Usa uma venv dedicada (`~/quality-venv`) e chama as ferramentas pelo
        # caminho absoluto `~/quality-venv/bin/*` — mesmo padrao do step Semgrep,
        # isolando defusedxml (scripts/coverage/*.py) e diff-cover (gate de
        # cobertura diferencial) do Python do sistema. Funciona tanto no runner
        # GitHub-hosted (ubuntu-latest) quanto em runner self-hosted.
        run: |
          if [ ! -d ~/quality-venv ]; then python3 -m venv ~/quality-venv; fi
          ~/quality-venv/bin/pip install --quiet --upgrade pip
          ~/quality-venv/bin/pip install --quiet -r scripts/requirements.txt

      - name: Backend quality gate
        working-directory: backend
        run: ./mvnw -B -Pstrict-quality verify -Ddependency-check.skip=true

      # regression-tests step removed — verify without testGroups already runs all tests (no filter)

      - name: Fetch PR base branch
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      # diff-cover vem da venv ~/quality-venv (step "Install Python deps"), chamado
      # por caminho absoluto pois `pip`/console-scripts não estão no PATH do runner.

      # BLOCKER (peça central): 80% de cobertura APENAS nas linhas alteradas do PR.
      # --src-roots é obrigatório em monorepo p/ casar o jacoco.xml (paths por
      # package, sem prefixo) com o git diff. if: success() de propósito: só roda
      # se o verify (acima) produziu o jacoco.xml — senão diff-cover falharia por
      # arquivo ausente, mascarando a causa real (verify quebrado).
      - name: Diff coverage gate (80% on changed lines)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          ~/quality-venv/bin/diff-cover backend/target/site/jacoco/jacoco.xml \
            --compare-branch="origin/$BASE_REF" \
            --src-roots backend/src/main/java \
            --fail-under=80 \
            --markdown-report backend/target/diff-cover.md

      # ADIADO: mutation testing (PIT) está DESATIVADO (if: false).
      # Smoke local em 2026-06-03 confirmou incompatibilidade com Java 25:
      # "Unsupported class file major version 69" (PIT 1.19.1 / ASM não lê
      # bytecode JDK 25). Ver hcoles/pitest#1439. O plugin permanece declarado no
      # pom, pronto para reativar: basta trocar `if: false` por
      # `if: github.event_name == 'pull_request'` quando o PIT suportar JDK 25.
      - name: Mutation testing (changed classes only)
        if: false
        continue-on-error: true
        working-directory: backend
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          ./mvnw -B org.pitest:pitest-maven:scmMutationCoverage \
            -DoriginBranch="origin/$BASE_REF" \
            -DdestinationBranch=HEAD \
            -Dinclude=ADDED,MODIFIED \
            -DmutationThreshold=70

      # WARNING: higiene de dependências (declaradas-não-usadas / usadas-não-declaradas).
      # No Maven, coordenada inexistente já falha o build na resolução.
      - name: Dependency hygiene
        continue-on-error: true
        working-directory: backend
        run: |
          ./mvnw -B dependency:analyze -DfailOnWarning=false
          ./mvnw -B dependency:resolve

      - name: Prepare base backend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/base-backend-coverage
          cp backend/target/site/jacoco/jacoco.xml /tmp/base-backend-coverage/

      - name: Save base backend coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: /tmp/base-backend-coverage
          key: base-backend-coverage-${{ github.sha }}

      - name: Restore base backend coverage
        if: github.event_name == 'pull_request'
        id: base-backend-coverage
        uses: actions/cache/restore@v4
        with:
          path: /tmp/base-backend-coverage
          key: base-backend-coverage-${{ github.event.pull_request.base.sha }}

      - name: Backend coverage no-decrease
        if: github.event_name == 'pull_request' && steps.base-backend-coverage.outputs.cache-hit == 'true'
        # Usa o python da venv ~/quality-venv (onde defusedxml está instalado); o
        # `python3` do sistema no runner não enxerga o defusedxml.
        run: |
          ~/quality-venv/bin/python scripts/coverage/compare_backend_coverage.py \
            backend/target/site/jacoco/jacoco.xml \
            /tmp/base-backend-coverage/jacoco.xml

      - name: Skip backend coverage check (no baseline)
        if: github.event_name == 'pull_request' && steps.base-backend-coverage.outputs.cache-hit != 'true'
        run: echo "::warning::No base backend coverage cached for ${{ github.event.pull_request.base.sha }}. Skipping comparison."

      - name: Upload backend JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: |
            backend/target/site/jacoco
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
            backend/target/pmd.xml
            backend/target/cpd.xml
            backend/target/spotbugs-security.xml
            backend/target/diff-cover.md

      # --- Decoração de PR (não-bloqueante: continue-on-error em tudo) ---

      - name: Setup reviewdog
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: reviewdog/action-setup@v1

      - name: Report Checkstyle (inline, só linhas do diff)
        # hashFiles guard: só roda se o relatório existe (se o verify foi pulado,
        # o arquivo não existe e o reviewdog imprimiria usage + exit 1).
        if: always() && github.event_name == 'pull_request' && hashFiles('backend/target/checkstyle-result.xml') != ''
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=checkstyle -name=checkstyle \
            -reporter=github-pr-review -filter-mode=added -fail-level=none \
            < backend/target/checkstyle-result.xml

      - name: JUnit test report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Diff coverage comment
        if: always() && github.event_name == 'pull_request' && hashFiles('backend/target/diff-cover.md') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: backend-diff-coverage
          path: backend/target/diff-cover.md

      - name: Backend runtime smoke
        working-directory: backend
        run: |
          # Aponta o jar executável da app explicitamente: target/ também contém
          # findsecbugs-plugin-*.jar (o spotbugs-maven-plugin copia os detectores
          # para lá), e `target/*.jar` pegaria o plugin primeiro (sem Main-Class).
          APP_JAR=$(ls target/nossalista-*.jar | grep -v '\.original$' | head -1)
          java -jar "$APP_JAR" --spring.profiles.active=ci > /tmp/backend-smoke.log 2>&1 &
          APP_PID=$!
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
            echo "::error::Backend failed to start within 120s"
            echo "--- Smoke log: key events ---"
            grep -E "Started|ERROR|WARN|Exception|FAILED|Tomcat|template" /tmp/backend-smoke.log | tail -30 || true
            echo "--- Smoke log: last 30 lines ---"
            tail -30 /tmp/backend-smoke.log
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$APP_PID"

  # backend-smoke job removed — smoke test is now the last step in backend-quality

  security-and-compliance:
    needs: changes
    runs-on: ubuntu-latest
    # 50min como BACKSTOP apenas — o controle real é o timeout-minutes: 30 no step
    # "Backend dependency check" (step estourado ainda permite salvar o cache NVD
    # parcial via if: always(); job cancelado não). Histórico: NVD throttled estourou
    # 20min 3x e 40min 2x em 02-03/07/2026.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-node

      - name: Setup Java
        if: needs.changes.outputs.backend == 'true'
        uses: ./.github/actions/setup-java

      # Binário baixado direto de github.com/releases (não de api.github.com) e
      # cacheado — espelha o padrão do Gitleaks abaixo. A action oficial
      # `editorconfig-checker/action-editorconfig-checker` consulta
      # `api.github.com/.../releases/latest` em todo run (sem cache), o que derruba
      # a CI quando o api.github.com está indisponível (visto em 2026-06-10).
      - name: Cache editorconfig-checker
        id: cache-ec
        uses: actions/cache@v4
        with:
          path: ~/bin/ec
          key: ec-${{ runner.os }}-${{ runner.arch }}-${{ env.EC_VERSION }}

      - name: Install editorconfig-checker
        if: steps.cache-ec.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bin
          ARCH=$(dpkg --print-architecture)
          curl -sSfL "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/ec-linux-${ARCH}.tar.gz" | tar -xz "bin/ec-linux-${ARCH}"
          mv "bin/ec-linux-${ARCH}" ~/bin/ec
          chmod +x ~/bin/ec

      - name: EditorConfig check
        run: ~/bin/ec

      - name: Cache Gitleaks
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: ~/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bin
          # Gitleaks (GoReleaser) nomeia o asset x86_64 como `x64`, nao `amd64`.
          # `dpkg --print-architecture` retorna `amd64` no runner GitHub-hosted e
          # `arm64` no self-hosted — mapeia amd64 -> x64; arm64 ja casa o asset.
          ARCH=$(dpkg --print-architecture)
          case "$ARCH" in
            amd64) GL_ARCH=x64 ;;
            *) GL_ARCH="$ARCH" ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz" | tar -xz gitleaks
          mv gitleaks ~/bin/gitleaks

      - name: Gitleaks
        run: ~/bin/gitleaks detect --source . --redact

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-${{ runner.arch }}

      - name: Semgrep
        run: |
          if [ ! -f ~/semgrep-venv/bin/semgrep ]; then
            python3 -m venv ~/semgrep-venv
            ~/semgrep-venv/bin/pip install semgrep --quiet
          fi
          ~/semgrep-venv/bin/semgrep scan --config p/security-audit --error .

      - name: Frontend install
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Frontend license policy
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npx --yes license-checker --production --failOn 'GPL;AGPL;LGPL'

      - name: Set NVD cache week
        if: needs.changes.outputs.backend == 'true'
        run: echo "NVD_WEEK=$(date +'%Y-%U')" >> "$GITHUB_ENV"

      # Cache NVD em restore/save separados: o post-step do actions/cache não roda
      # quando o job é cancelado por timeout, então o download parcial do feed NVD
      # era descartado e cada run recomeçava do zero (ciclo vicioso em dias de NVD
      # throttled — visto 5x em 02-03/07/2026). O save com if: always() + key única
      # por tentativa preserva o progresso parcial; o restore-keys pega o cache mais
      # recente e o update continua de onde parou, convergindo em poucos runs.
      - name: Restore NVD database cache
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-week-${{ env.NVD_WEEK }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nvd-${{ runner.os }}-week-${{ env.NVD_WEEK }}-
            nvd-${{ runner.os }}-

      # timeout no STEP (menor que o do job): quando estoura, o step falha mas os
      # steps seguintes com if: always() ainda rodam — é o que permite salvar o
      # cache parcial. O timeout do job (50min) fica só como backstop.
      - name: Backend dependency check
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        timeout-minutes: 30
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          ./mvnw -B org.owasp:dependency-check-maven:check

      - name: Save NVD database cache (mesmo em falha/timeout do step)
        if: always() && needs.changes.outputs.backend == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-week-${{ env.NVD_WEEK }}-run-${{ github.run_id }}-${{ github.run_attempt }}
