name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.app == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        if: matrix.app == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Frontend install
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm ci

      - name: Frontend test
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run test -- --run

      - name: Frontend build
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run build

      - name: Ensure Maven wrapper is executable
        if: matrix.app == 'backend'
        working-directory: backend
        run: chmod +x mvnw

      - name: Backend quality gate
        if: matrix.app == 'backend'
        working-directory: backend
        run: ./mvnw -B -Pstrict-quality verify

      - name: Backend regression tests
        if: matrix.app == 'backend'
        working-directory: backend
        run: ./mvnw -B -Pregression-tests test

      - name: Upload backend JaCoCo report
        if: matrix.app == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
