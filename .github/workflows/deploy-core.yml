name: Deploy Core

on:
  workflow_call:
    inputs:
      app_name:
        description: "Nome da aplicação (deployment k8s e imagem GHCR)"
        required: true
        type: string
      app_namespace:
        description: "Namespace Kubernetes alvo"
        required: true
        type: string
      app_type:
        description: "Tipo: 'backend' ou 'frontend' (reservado para uso futuro)"
        required: true
        type: string
      dockerfile_path:
        description: "Caminho para o Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      java_version:
        description: "Versão do Java (build via Docker, reservado)"
        required: false
        type: string
        default: "25"
      node_version:
        description: "Versão do Node (build via Docker, reservado)"
        required: false
        type: string
        default: "22"
      k8s_path:
        description: "Caminho para os manifestos Kubernetes"
        required: false
        type: string
        default: "./k8s"
      image_tag:
        description: "Tag da imagem Docker"
        required: false
        type: string
        default: "latest"
      ref:
        description: "Git ref para checkout (tag, SHA ou branch)"
        required: false
        type: string
        default: ""
    secrets:
      TAILSCALE_AUTHKEY:
        required: false
      KUBECONFIG:
        required: false
      GHCR_PAT:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || github.token }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.app_name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ inputs.app_name }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (manifestos k8s)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar KUBECONFIG
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Aplicar manifestos Kubernetes
        run: kubectl apply -f ${{ inputs.k8s_path }}

      - name: Rollout restart do deployment
        run: kubectl rollout restart deployment/${{ inputs.app_name }} -n ${{ inputs.app_namespace }}

      - name: Aguardar rollout completar
        run: kubectl rollout status deployment/${{ inputs.app_name }} -n ${{ inputs.app_namespace }} --timeout=300s
