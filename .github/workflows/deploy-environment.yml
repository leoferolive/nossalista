name: Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Ambiente alvo: 'dev' ou 'prod'"
        required: true
        type: string
      tag:
        description: "Tag da imagem Docker a deployar"
        required: true
        type: string
      ref:
        description: "Git ref (tag, SHA ou branch) para fazer checkout do código"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy ${{ inputs.environment }} tag=${{ inputs.tag }} ref=${{ inputs.ref }}"
