name: Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Ambiente alvo: 'dev' ou 'prod'"
        required: true
        type: string
      tag:
        description: "Tag da imagem Docker a deployar"
        required: true
        type: string
      ref:
        description: "Git ref (tag, SHA ou branch) para fazer checkout do código"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.environment == 'prod' && 'nossalista' || 'nossalista-dev' }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ inputs.environment == 'prod' && 'nossalista' || 'nossalista-dev' }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (manifestos k8s)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar KUBECONFIG
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Aplicar manifestos Kubernetes
        run: kubectl apply -f ${{ inputs.environment == 'prod' && './k8s/prod' || './k8s/dev' }}

      - name: Rollout restart do deployment
        run: |
          APP_NAME="${{ inputs.environment == 'prod' && 'nossalista' || 'nossalista-dev' }}"
          kubectl rollout restart deployment/$APP_NAME -n $APP_NAME

      - name: Aguardar rollout completar
        run: |
          APP_NAME="${{ inputs.environment == 'prod' && 'nossalista' || 'nossalista-dev' }}"
          kubectl rollout status deployment/$APP_NAME -n $APP_NAME --timeout=300s
