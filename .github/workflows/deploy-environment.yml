name: Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Ambiente alvo: 'dev' ou 'prod'"
        required: true
        type: string
      tag:
        description: "Tag da imagem Docker a deployar"
        required: true
        type: string
      ref:
        description: "Git ref (tag, SHA ou branch) para fazer checkout do código"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      resolved_sha: ${{ steps.meta.outputs.resolved_sha }}
      build_time: ${{ steps.meta.outputs.build_time }}
      app_name: ${{ steps.meta.outputs.app_name }}
      namespace: ${{ steps.meta.outputs.namespace }}
      image_repository: ${{ steps.meta.outputs.image_repository }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve deploy metadata
        id: meta
        run: |
          set -euo pipefail

          RESOLVED_SHA="$(git rev-parse HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_NAME="${{ inputs.environment == 'prod' && 'nossalista' || 'nossalista-dev' }}"
          NAMESPACE="$APP_NAME"
          IMAGE_REPOSITORY="ghcr.io/${{ github.repository_owner }}/${{ inputs.environment == 'prod' && 'nossalista' || 'nossalista-dev' }}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${{ inputs.tag }}"

          echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Validar GHCR_PAT configurado
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_PAT:-}" ]; then
            echo "::error::GHCR_PAT não configurado — configure o secret com escopo write:packages para o push ao GHCR."
            exit 1
          fi
          echo "GHCR_PAT presente."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Em runner GitHub-hosted (x86) o binfmt/QEMU permite o stage 3 (runtime
      # arm64: apt-get curl + copy do jar) rodar emulado. Os stages pesados de
      # build (npm/maven) usam --platform=$BUILDPLATFORM e rodam nativos em x86,
      # entao so o stage final minimo e emulado. Em self-hosted ARM era nativo.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # GHCR_PAT obrigatório (validado no step "Validar GHCR_PAT configurado").
          # Sem fallback p/ github.token: ele não tem write:packages e o push falharia
          # de forma confusa em vez de parar cedo com mensagem clara.
          password: ${{ secrets.GHCR_PAT }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_repository }}:latest
            ${{ needs.prepare.outputs.image_uri }}
          labels: |
            org.opencontainers.image.title=NossaLista
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.resolved_sha }}
            org.opencontainers.image.ref.name=${{ inputs.ref }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_time }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_repository }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_repository }}:buildcache,mode=max
          build-args: |
            GIT_SHA=${{ needs.prepare.outputs.resolved_sha }}
            APP_VERSION=${{ inputs.tag }}
            APP_GIT_SHA=${{ needs.prepare.outputs.resolved_sha }}
            APP_GIT_TAG=${{ inputs.tag }}
            APP_BUILD_TIME=${{ needs.prepare.outputs.build_time }}
            APP_ENVIRONMENT=${{ inputs.environment }}

  deploy:
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (manifestos k8s)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # O kube-apiserver do K3s nao e exposto na internet: o KUBECONFIG aponta
      # para o IP Tailscale do no. Em runner GitHub-hosted precisamos entrar na
      # tailnet antes do kubectl (no self-hosted o no ja estava na tailnet).
      - name: Conectar na Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar KUBECONFIG
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Aplicar manifestos Kubernetes
        run: kubectl apply -f ${{ inputs.environment == 'prod' && './k8s/prod' || './k8s/dev' }}

      - name: Atualizar imagem e metadata do deployment
        run: |
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          NAMESPACE="${{ needs.prepare.outputs.namespace }}"
          IMAGE_URI="${{ needs.prepare.outputs.image_uri }}"

          kubectl set image "deployment/$APP_NAME" \
            "$APP_NAME=$IMAGE_URI" \
            -n "$NAMESPACE"

          # NOTA (fonte única da metadata de build): APP_VERSION / APP_GIT_TAG /
          # APP_GIT_SHA / APP_BUILD_TIME / APP_ENVIRONMENT NÃO são injetados aqui
          # via `kubectl set env`. Esses valores já são embutidos como ENV na
          # imagem (Dockerfile stage 3, a partir dos build-args do job
          # build-and-push). Reinjetá-los no Deployment criava dupla fonte de
          # verdade e podia mascarar o que de fato roda no container. A imagem é a
          # fonte canônica; as annotations abaixo seguem como registro auditável
          # do deploy.
          kubectl annotate "deployment/$APP_NAME" \
            "deploy.nossalista/tag=${{ inputs.tag }}" \
            "deploy.nossalista/sha=${{ needs.prepare.outputs.resolved_sha }}" \
            "deploy.nossalista/build-time=${{ needs.prepare.outputs.build_time }}" \
            --overwrite \
            -n "$NAMESPACE"

      - name: Aguardar rollout completar
        run: |
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          NAMESPACE="${{ needs.prepare.outputs.namespace }}"
          # 540s cobre o boot lento do Spring Boot no Raspberry Pi ARM (~180-195s),
          # o pull da imagem e a janela do startupProbe (dev 315s / prod 360s).
          # Com 300s o rollout dava timeout antes do pod ficar Ready (falso negativo).
          kubectl rollout status "deployment/$APP_NAME" -n "$NAMESPACE" --timeout=540s

      - name: Resumo final do deploy
        if: always()
        run: |
          set +e
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          NAMESPACE="${{ needs.prepare.outputs.namespace }}"
          DEPLOYED_IMAGE="$(kubectl get deployment "$APP_NAME" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)"
          DEPLOYED_TAG="$(kubectl get deployment "$APP_NAME" -n "$NAMESPACE" -o jsonpath='{.metadata.annotations.deploy\.nossalista/tag}' 2>/dev/null)"
          DEPLOYED_SHA="$(kubectl get deployment "$APP_NAME" -n "$NAMESPACE" -o jsonpath='{.metadata.annotations.deploy\.nossalista/sha}' 2>/dev/null)"

          [ -z "$DEPLOYED_IMAGE" ] && DEPLOYED_IMAGE="indisponivel"
          [ -z "$DEPLOYED_TAG" ] && DEPLOYED_TAG="${{ inputs.tag }}"
          [ -z "$DEPLOYED_SHA" ] && DEPLOYED_SHA="${{ needs.prepare.outputs.resolved_sha }}"

          JOB_RESULT="${{ job.status }}"
          RESULT_LABEL="SUCESSO"
          if [ "$JOB_RESULT" != "success" ]; then
            RESULT_LABEL="FALHA"
          fi

          echo "Resultado: $RESULT_LABEL"
          echo "Environment: ${{ inputs.environment }}"
          echo "Tag version deployada: $DEPLOYED_TAG"
          echo "Imagem deployada: $DEPLOYED_IMAGE"
          echo "Git SHA: $DEPLOYED_SHA"
          echo "Build time (UTC): ${{ needs.prepare.outputs.build_time }}"
          echo "Deployment/Namespace: $APP_NAME/$NAMESPACE"

          {
            echo "## Deployment Summary"
            echo
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Resultado | $RESULT_LABEL |"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Tag version deployada | \`$DEPLOYED_TAG\` |"
            echo "| Imagem deployada | \`$DEPLOYED_IMAGE\` |"
            echo "| Git SHA | \`$DEPLOYED_SHA\` |"
            echo "| Build time (UTC) | \`${{ needs.prepare.outputs.build_time }}\` |"
            echo "| Deployment/Namespace | \`$APP_NAME/$NAMESPACE\` |"
          } >> "$GITHUB_STEP_SUMMARY"
