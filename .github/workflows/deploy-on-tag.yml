name: Deploy Dev on Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag semântica a deployar em dev (ex: v1.2.3)"
        required: true
      ref:
        description: "SHA do commit correspondente à tag"
        required: true

concurrency:
  group: deploy-dev-on-tag
  cancel-in-progress: false

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.ref }}
    secrets: inherit
