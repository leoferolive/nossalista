name: Deploy Dev on Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag semântica da imagem a deployar em dev (ex: v1.2.3)"
        required: true
      ref:
        description: "Ref do checkout que será reconstruído (normalmente o SHA correspondente à tag)"
        required: true

concurrency:
  group: deploy-dev-on-tag
  cancel-in-progress: false

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      tag: ${{ inputs.tag }} # tag da imagem implantada
      ref: ${{ inputs.ref }} # ref exato usado para checkout e build
    secrets: inherit
