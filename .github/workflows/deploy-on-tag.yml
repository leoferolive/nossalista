name: Deploy Dev on Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag semântica a deployar em dev (ex: v1.2.3)"
        required: true
      ref:
        description: "SHA do commit correspondente à tag"
        required: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: deploy-dev-on-tag
  cancel-in-progress: false

jobs:
  deploy-dev:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      tag: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.ref || github.sha }}
    secrets: inherit
