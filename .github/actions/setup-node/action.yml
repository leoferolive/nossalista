name: Setup Node.js
description: Configura Node.js com cache npm para o monorepo

inputs:
  node-version:
    description: "Versão do Node.js"
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json
