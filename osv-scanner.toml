ignoreUntil = 2026-10-29
reason = """
brace-expansion: DoS via expansao ilimitada de padrao glob. Duas instancias
dev-only na arvore de devDependencies do frontend:
(1) via eslint -> minimatch@3.x — o fix exige brace-expansion >=5.0.8, que
    mudou a forma de export (function default -> named export 'expand'),
    incompativel com minimatch@3.x/5.x. So resolve com bump maior do ESLint
    (9->10), que exige validar compat de flat config + plugins — tratado
    como tarefa dedicada separada, nao um patch pontual.
(2) via workbox-build -> @trickfilm400/rollup-plugin-off-main-thread -> ejs
    -> jake -> filelist -> minimatch@5.x — workbox-build ja esta na ultima
    versao publicada (7.4.1); nao ha fix upstream disponivel ainda.
Risco real baixo: exploracao exigiria padrao glob malicioso alimentado ao
tooling de lint/build local, nao ao runtime de producao.
"""
