# Supressoes documentadas do OSV-Scanner (scan completo em push/main + cron).
# Cada entrada precisa de justificativa e reavaliacao periodica via
# `ignoreUntil` — quando a data passar, o achado volta a aparecer no scan
# ate ser reavaliado (nao e supressao permanente).

[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2"
ignoreUntil = 2027-01-29
reason = """
react-router: CSRF bypass em modo RSC (React Server Components). A advisory
oficial afirma explicitamente que 'this only affects your application if you
are using the unstable RSC APIs'. O frontend usa react-router-dom em modo SPA
classico (BrowserRouter), sem RSC — o caminho de codigo vulneravel nao e
exercitado nesta aplicacao. Nao ha bump planejado; reavaliar se o app
eventualmente migrar para RSC.
"""

[[IgnoredVulns]]
