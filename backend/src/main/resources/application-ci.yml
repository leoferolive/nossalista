cors:
  allowed-origins: http://localhost:5173,http://localhost:8080,http://127.0.0.1:4173

spring:
  datasource:
    url: jdbc:h2:mem:ci;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ci-secret-key-minimum-32-characters-for-hmac-sha256-algorithm
  expiration: 3600000

frontend:
  url: http://127.0.0.1:4173

management:
  health:
    mail:
      enabled: false

app:
  mcp-oauth:
    issuer: http://127.0.0.1:4173
    resource: http://127.0.0.1:4173/mcp
    # Diferente de JWT_SECRET (mesmo propósito, chave distinta e obrigatória).
    signing-key: ci-mcp-oauth-signing-key-minimum-32-bytes-for-hmac-test
  email:
    smtp:
      enabled: false
