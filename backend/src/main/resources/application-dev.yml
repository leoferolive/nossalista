cors:
  allowed-origins: https://nossalista.leoferolive.com.br,http://nossalista.home,http://localhost:5173,http://localhost:8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nossalista_dev}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:nossalista_dev}
    password: ${DATABASE_PASSWORD:nossalistadev}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # Sem default: JWT_SECRET é obrigatório também em dev (injetado pelo secret
  # k8s nossalista-secrets). A app faz fail-fast (JwtService) se ausente/fraco.
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 dias em milissegundos

management:
  health:
    mail:
      enabled: false

app:
  auth:
    # HTTP local não suporta Secure nem o prefixo __Host-. Este override nunca
    # é herdado por prod, que valida a configuração endurecida na inicialização.
    session-cookie:
      name: nl_session
      secure: false
      same-site: Lax
    # Dev: enforcement desligado para não atrapalhar o fluxo local de testes.
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
  mcp-oauth:
    # Listas em @ConfigurationProperties NÃO mesclam entre profiles — este
    # bloco SUBSTITUI por completo `app.mcp-oauth.clients` de application.yml,
    # então precisa repetir claude-ai/claude-code e ACRESCENTAR o cliente de
    # teste local. Mantém "nossalista-local" fora de application.yml (base,
    # compartilhada com prod) — achado do review, M-3.
    clients:
      - id: claude-ai
        name: "Claude (claude.ai)"
        redirect-uris:
          - https://claude.ai/api/mcp/auth_callback
          - https://claude.com/api/mcp/auth_callback
        allow-loopback-redirect: false
      - id: claude-code
        name: "Claude Code"
        redirect-uris: []
        allow-loopback-redirect: true
      - id: nossalista-local
        name: "Cliente local de teste"
        redirect-uris:
          - http://localhost:8765/callback
        allow-loopback-redirect: false
  email:
    smtp:
      enabled: false

logging:
  level:
    br.com.leoferolive.nossalista: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
