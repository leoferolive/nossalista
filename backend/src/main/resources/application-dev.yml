spring:
  datasource:
    url: jdbc:postgresql://192.168.3.63:30001/nossalista_dev
    driver-class-name: org.postgresql.Driver
    username: nossalista_dev
    password: nossalistadev

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: dev-secret-key-minimum-32-characters-for-hmac-sha256-algorithm
  expiration: 604800000  # 7 dias em milissegundos

logging:
  level:
    br.com.leoferolive.nossalista: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
