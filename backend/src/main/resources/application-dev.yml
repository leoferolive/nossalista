cors:
  allowed-origins: https://nossalista.leoferolive.com.br,http://nossalista.home,http://localhost:5173,http://localhost:8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nossalista_dev}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:nossalista_dev}
    password: ${DATABASE_PASSWORD:nossalistadev}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars}
  expiration: 604800000  # 7 dias em milissegundos

app:
  email:
    smtp:
      enabled: false

logging:
  level:
    br.com.leoferolive.nossalista: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
