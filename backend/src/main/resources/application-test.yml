cors:
  allowed-origins: http://localhost:5173,http://localhost:8080

spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: test-secret-key-minimum-32-characters-for-hmac-sha256-algorithm
  expiration: 3600000

frontend:
  url: http://localhost:5173

app:
  email:
    smtp:
      enabled: false
