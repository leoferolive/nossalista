spring:
  application:
    name: nossalista

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            authorization-grant-type: authorization_code
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  thymeleaf:
    check-template-location: true

cors:
  allowed-origins: https://nossalista.leoferolive.com.br

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  # Sem default: JWT_SECRET é obrigatório. A aplicação falha na inicialização
  # (JwtService.validateSecret) se ausente, placeholder ou < 32 bytes para HS256.
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 dias em milissegundos

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:nossalista@leoferolive.com.br}

app:
  auth:
    # Q2.7: enforcement estrito de verificação de e-mail no login email/senha.
    # Default false: o status email_verified é registrado mas o login NÃO é
    # bloqueado — evita deslogar contas pré-existentes e não afeta OAuth (Google).
    # Ligue (true) somente quando as contas relevantes já estiverem verificadas.
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
  email:
    from: ${EMAIL_FROM:no-reply@nossalista.leoferolive.com.br}
    from-name: ${EMAIL_FROM_NAME:NossaLista}
  build:
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    git-sha: ${APP_GIT_SHA:unknown}
    git-tag: ${APP_GIT_TAG:unknown}
    environment: ${APP_ENVIRONMENT:local}
    build-time: ${APP_BUILD_TIME:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: nossalista

logging:
  level:
    br.com.leoferolive.nossalista: INFO
    org.springframework.security: INFO
