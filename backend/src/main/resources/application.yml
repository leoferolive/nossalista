spring:
  application:
    name: nossalista

  ai:
    mcp:
      server:
        # Fixa o transporte em STREAMABLE explicitamente. Sem isso, a
        # resolução do protocolo padrão do spring-ai-starter-mcp-server-webmvc
        # 2.0.0 é instável fora do contexto de @SpringBootTest: em uma
        # aplicação real (mvnw spring-boot:run ou jar empacotado), o
        # RouterFunction registrado acaba sendo o do transporte SSE
        # (deprecated, POST /mcp/message + GET /sse) em vez do Streamable
        # HTTP em POST /mcp documentado — quebrando qualquer cliente MCP
        # (Claude Code, Cursor) que siga docs/mcp.md, apesar de
        # McpServerIntegrationTest passar 100% (ver achado do QA da Fase B).
        # src/test/resources/application.yml já tinha esse mesmo fix, mas
        # esse arquivo SUBSTITUI (não mescla com) este no classpath de teste
        # — por isso os testes sempre passaram enquanto a app real quebrava.
        protocol: STREAMABLE
        type: SYNC
        name: nossalista-mcp
        version: 1.0.0
        endpoint: /mcp

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            authorization-grant-type: authorization_code
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  thymeleaf:
    check-template-location: true


cors:
  allowed-origins: https://nossalista.leoferolive.com.br

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  # Sem default: JWT_SECRET é obrigatório. A aplicação falha na inicialização
  # (JwtService.validateSecret) se ausente, placeholder ou < 32 bytes para HS256.
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 dias em milissegundos

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:nossalista@leoferolive.com.br}

app:
  auth:
    # Q2.7: enforcement estrito de verificação de e-mail no login email/senha.
    # Default false: o status email_verified é registrado mas o login NÃO é
    # bloqueado — evita deslogar contas pré-existentes e não afeta OAuth (Google).
    # Ligue (true) somente quando as contas relevantes já estiverem verificadas.
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
  # Servidor de autorização OAuth 2.1 embutido para clientes do servidor MCP
  # (Fase C do roadmap MCP — ver docs/DECISIONS.md D-022 e docs/mcp.md).
  # Clientes são registrados ESTATICAMENTE por padrão, complementados por
  # Dynamic Client Registration (Fase C.1, D-024 — bloco `dcr` abaixo).
  mcp-oauth:
    issuer: ${MCP_OAUTH_ISSUER:http://localhost:8080}
    resource: ${MCP_OAUTH_RESOURCE:http://localhost:8080/mcp}
    # Sem default: MCP_OAUTH_SIGNING_KEY é obrigatório. McpOAuthJwtService faz
    # fail-fast (mesmo padrão de JWT_SECRET) se ausente ou < 32 bytes. NUNCA
    # deve ser igual a JWT_SECRET — chaves de assinatura independentes.
    signing-key: ${MCP_OAUTH_SIGNING_KEY}
    pending-authorization-ttl: 10m
    code-ttl: 60s
    # Curto deliberadamente (achado do QA): access token é JWT stateless, então
    # revogar a família de refresh (replay/reuso) não o invalida instantaneamente
    # — ele vale até expirar. Ver docs/DECISIONS.md (D-022).
    access-token-ttl: 10m
    refresh-token-ttl: 30d
    clients:
      - id: claude-ai
        name: "Claude (claude.ai)"
        redirect-uris:
          - https://claude.ai/api/mcp/auth_callback
          - https://claude.com/api/mcp/auth_callback
        allow-loopback-redirect: false
      - id: claude-code
        name: "Claude Code"
        redirect-uris: []
        # Claude Code escolhe uma porta aleatória por padrão a cada conexão OAuth
        # (a menos que --callback-port seja usado) — ver Passo 0 de D-022.
        allow-loopback-redirect: true
      # NÃO registrar aqui um cliente de teste local (ex.: "nossalista-local",
      # redirect http://localhost:8765/callback): este arquivo é a base
      # compartilhada por TODOS os profiles, inclusive prod (achado do review,
      # M-3). Um cliente assim só deve existir em profiles não-prod — ver
      # `app.mcp-oauth.clients` em application-dev.yml.
    # Dynamic Client Registration (RFC 7591, Fase C.1 — ver docs/DECISIONS.md
    # D-024): destrava o "Add connector" do claude.ai, que tenta DCR automático
    # e falha (oauth_error=registration_endpoint_missing) sem `POST /oauth/register`.
    dcr:
      enabled: ${MCP_OAUTH_DCR_ENABLED:true}
      rate-limit-per-ip-per-hour: 10
      max-registered-clients: 500
      unused-client-ttl: 30d
  email:
    from: ${EMAIL_FROM:no-reply@nossalista.leoferolive.com.br}
    from-name: ${EMAIL_FROM_NAME:NossaLista}
  build:
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    git-sha: ${APP_GIT_SHA:unknown}
    git-tag: ${APP_GIT_TAG:unknown}
    environment: ${APP_ENVIRONMENT:local}
    build-time: ${APP_BUILD_TIME:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: nossalista

logging:
  level:
    br.com.leoferolive.nossalista: INFO
    org.springframework.security: INFO
