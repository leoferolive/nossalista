spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""  # Required but can be empty for H2

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate  # Flyway gerencia schema, JPA apenas valida
    show-sql: true

  flyway:
    enabled: true  # Usar Flyway para executar migrations e seeds
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            authorization-grant-type: authorization_code
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  ai:
    mcp:
      server:
        # Precisa ser repetido aqui: este arquivo SUBSTITUI (não mescla com)
        # src/main/resources/application.yml no classpath de teste — sem
        # isso, o autoconfigure do Spring AI cai no protocolo SSE legado por
        # padrão (protocol=STREAMABLE não tem matchIfMissing=true).
        protocol: STREAMABLE
        type: SYNC
        name: nossalista-mcp
        version: 1.0.0
        endpoint: /mcp

cors:
  allowed-origins: http://localhost:5173,http://localhost:8080

jwt:
  secret: test-secret-key-minimum-32-characters-for-hmac-sha256-algorithm-testing
  expiration: 604800000  # 7 dias em milissegundos

frontend:
  url: http://localhost:5173

vapid:
  public-key: ""
  private-key: ""
  subject: mailto:test@example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: nossalista

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG
