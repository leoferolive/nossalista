spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""  # Required but can be empty for H2

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate  # Flyway gerencia schema, JPA apenas valida
    show-sql: true

  flyway:
    enabled: true  # Usar Flyway para executar migrations e seeds
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            authorization-grant-type: authorization_code
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  ai:
    mcp:
      server:
        # Precisa ser repetido aqui: este arquivo SUBSTITUI (não mescla com)
        # src/main/resources/application.yml no classpath de teste — sem
        # isso, o autoconfigure do Spring AI cai no protocolo SSE legado por
        # padrão (protocol=STREAMABLE não tem matchIfMissing=true).
        protocol: STREAMABLE
        type: SYNC
        name: nossalista-mcp
        version: 1.0.0
        endpoint: /mcp

cors:
  allowed-origins: http://localhost:5173,http://localhost:8080

jwt:
  secret: test-secret-key-minimum-32-characters-for-hmac-sha256-algorithm-testing
  expiration: 604800000  # 7 dias em milissegundos

frontend:
  url: http://localhost:5173

app:
  # Precisa ser repetido aqui pelo MESMO motivo documentado em docs/DECISIONS.md
  # (D-020): este arquivo SUBSTITUI (não mescla com) src/main/resources/application.yml
  # no classpath de teste. Sem isso, McpOAuthJwtService falha no @PostConstruct
  # (signing-key ausente) e derruba TODO @SpringBootTest.
  mcp-oauth:
    issuer: http://localhost:8080
    resource: http://localhost:8080/mcp
    signing-key: test-mcp-oauth-signing-key-minimum-32-bytes-for-hmac-testing
    pending-authorization-ttl: 10m
    code-ttl: 60s
    access-token-ttl: 10m
    refresh-token-ttl: 30d
    clients:
      - id: claude-ai
        name: "Claude (claude.ai)"
        redirect-uris:
          - https://claude.ai/api/mcp/auth_callback
          - https://claude.com/api/mcp/auth_callback
        allow-loopback-redirect: false
      - id: claude-code
        name: "Claude Code"
        redirect-uris: []
        allow-loopback-redirect: true
      - id: nossalista-local
        name: "Cliente local de teste"
        redirect-uris:
          - http://localhost:8765/callback
        allow-loopback-redirect: false

vapid:
  public-key: ""
  private-key: ""
  subject: mailto:test@example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: nossalista

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG
